<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Commitment Intelligence</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --accent:#ff4b4b; --track:#e3e6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1117; --card:#1a1f2b; --text:#f2f4f8; --muted:#a4adbd; --track:#2b3243; } }
  html, body { height: 100%; margin: 0; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1rem; box-sizing: border-box; }
  .card { background:var(--card); border-radius:14px; padding:2rem 1.6rem; max-width:420px; width:100%;
          box-shadow:0 6px 24px rgba(0,0,0,.12); text-align:center; }
  h1 { font-size:1.25rem; margin:0 0 .4rem; }
  p  { color:var(--muted); margin:.3rem 0; line-height:1.4; font-size:.95rem; }
  .bar { height:6px; background:var(--track); border-radius:99px; overflow:hidden; margin:1.2rem 0 .8rem; }
  .bar > i { display:block; height:100%; width:40%; background:var(--accent); border-radius:99px;
             animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
  ul { list-style:none; padding:0; margin:.8rem 0; text-align:left; font-size:.92rem; }
  li { padding:.2rem 0; }
  a.btn { display:inline-block; margin-top:.8rem; padding:.6rem 1.2rem; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main class="card">
  <h1>📋 AI Commitment Intelligence</h1>
  <p id="msg">Getting your AI assistant ready… This may take a little while on the first visit.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <ul>
    <li id="s-api">⏳ Waking the API…</li>
    <li id="s-dash">⏳ Waking the dashboard…</li>
  </ul>
  <p>You will be taken to the dashboard automatically.</p>
  <a class="btn" id="go" href="https://ai-commitment-intelligence.onrender.com/">Open dashboard now</a>
</main>

<script>
  // ---- Edit these two if your service URLs ever change ----
  var DASHBOARD_URL = "https://ai-commitment-intelligence.onrender.com/";
  var API_HEALTH_URL = "https://ai-commitment-api.onrender.com/health";
  // How long to wait before moving on. The wake-up requests keep running in the background (keepalive).
  var REDIRECT_AFTER_MS = 2500;

  // Fire-and-forget request. mode "no-cors" means we cannot read the answer (the API sends no CORS headers),
  // and we don't need to: arriving at the server is what makes Render start the sleeping service.
  function ping(url) {
    try {
      return fetch(url, { mode: "no-cors", cache: "no-store", keepalive: true })
        .then(function () { return true; }, function () { return false; });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function mark(id, ok, label) {
    var el = document.getElementById(id);
    if (el) el.textContent = (ok ? "✅ " : "⚠️ ") + label;
  }

  var noRedirect = /[?&]noredirect\b/.test(location.search);   // handy for testing: launcher/?noredirect
  var settled = 0, redirected = false;

  function go() {
    if (redirected || noRedirect) return;
    redirected = true;
    location.replace(DASHBOARD_URL);
  }

  ping(API_HEALTH_URL).then(function (ok) { mark("s-api", ok, ok ? "API request sent" : "API request failed (it will retry on the dashboard)"); });
  ping(DASHBOARD_URL).then(function (ok) { mark("s-dash", ok, ok ? "Dashboard request sent" : "Dashboard request failed"); });

  // Move on after a short, fixed delay: a sleeping service can take ~1 minute to answer and we must not wait for that.
  // The dashboard itself shows its own "getting ready" screen and waits for the API.
  setTimeout(go, REDIRECT_AFTER_MS);
</script>
</body>
</html>
